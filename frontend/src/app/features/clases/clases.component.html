@if (error) {
  <app-error [mensaje]="error" />
} @else {
  <h1>Agenda de clases</h1>
  <p class="tablas-bd">Tablas: <code>clase</code><code>modulo</code><code>matricula</code><code>instructor</code></p>

  @if (catalogos) {
    <form class="filtros" (ngSubmit)="filtrar()">
      <label>Estado
        <select name="estado" [(ngModel)]="filtro.estado" (ngModelChange)="filtrar()">
          <option value="">Todos</option>
          @for (e of catalogos.estadosClase; track e) { <option [value]="e">{{ e | texto }}</option> }
        </select>
      </label>
      <label>Tipo
        <select name="tipo" [(ngModel)]="filtro.tipo" (ngModelChange)="filtrar()">
          <option value="">Todos</option>
          @for (t of catalogos.tiposClase; track t) { <option [value]="t">{{ t | tipoClase }}</option> }
        </select>
      </label>
      <label>Instructor
        <select name="instructor" [(ngModel)]="filtro.instructor" (ngModelChange)="filtrar()">
          <option value="">Todos</option>
          @for (i of catalogos.instructores; track i.idInstructor) { <option [value]="'' + i.idInstructor">{{ i.nombre }}</option> }
        </select>
      </label>
      <label>Vehículo
        <select name="placa" [(ngModel)]="filtro.placa" (ngModelChange)="filtrar()">
          <option value="">Todos</option>
          @for (p of catalogos.placas; track p) { <option [value]="p">{{ p }}</option> }
        </select>
      </label>
      <label>Desde <input type="date" name="desde" [(ngModel)]="filtro.desde" (change)="filtrar()"></label>
      <label>Hasta <input type="date" name="hasta" [(ngModel)]="filtro.hasta" (change)="filtrar()"></label>
      <button class="btn sec" type="button" (click)="limpiar()">Quitar filtros</button>
    </form>
  }

  @if (!clases) {
    <p class="cargando" role="status">Cargando información…</p>
  } @else {
    <p class="resultado-meta">{{ clases.length }} clases · {{ horasSeleccion | numero: 0 }} horas sin contar canceladas</p>
    <section class="bloque">
      <app-tabla-clases [clases]="clases" vacio="Ninguna clase coincide con los filtros." />
    </section>
  }
}
