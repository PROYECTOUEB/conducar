# ConduLog - configuración del backend
spring.application.name=condulog
server.port=8080

# Conexión a MySQL (usuario consultor: solo lectura).
# Se pueden cambiar con variables de entorno DB_HOST, DB_PORT, DB_NAME, DB_USER y DB_PASSWORD.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:condulog}?serverTimezone=America/Bogota&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:consultor}
spring.datasource.password=${DB_PASSWORD:Consultor_2026}
spring.datasource.hikari.read-only=true
spring.datasource.hikari.maximum-pool-size=5

# Fechas en formato AAAA-MM-DD en las respuestas JSON
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Bogota

# La base de datos se crea con los scripts de la carpeta database (no se ejecutan scripts al arrancar)
spring.sql.init.mode=never
